spring:
  application:
    name: finance
  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: test_user
    password: ${DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}                      # Railway tells the app which port to use
  forward-headers-strategy: framework     # trust Railway's https proxy
  servlet:
    session:
      timeout: 10m                        # sign out after 10 minutes of inactivity (FR-AUTH-006)
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}    # true online (https), false on localhost

app:
  ai:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    api-key: ${AI_API_KEY:}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
    daily-limit: ${AI_DAILY_LIMIT:20}